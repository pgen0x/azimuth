<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Azimuth · Operations</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#172a36;background:#f5f5ef;--muted:#57656d;--line:#d6dcd7;--green:#245c4b}*{box-sizing:border-box}body{margin:0}header{background:#172a36;color:#fff;padding:22px 4vw;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;letter-spacing:2px;margin:0}header p{margin:0;color:#cbd7d8}nav{display:flex;gap:8px;padding:15px 4vw;border-bottom:1px solid var(--line);flex-wrap:wrap}button,input,select{font:inherit;border:1px solid #a5b2ad;border-radius:4px;padding:8px 12px;background:#fff;color:inherit}button{cursor:pointer}button[aria-current=true]{background:var(--green);color:#fff;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #bd6b24;outline-offset:3px}main{max-width:1500px;margin:auto;padding:25px 4vw}h2{font-size:25px;margin:0 0 6px}h3{font-size:18px;margin:25px 0 10px}p{margin:8px 0}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;margin:20px 0}.metric{padding:18px;border:1px solid var(--line);background:#fff}.metric strong{display:block;font-size:28px;font-weight:550;font-variant-numeric:tabular-nums;margin:8px 0}.note{background:#e6ede7;padding:13px 17px;border-left:3px solid #527561;margin:15px 0}.warn{background:#fff0d7;border-color:#aa6c21}.table{overflow-x:auto;background:#fff;border:1px solid var(--line);margin:12px 0}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:11px 14px;border-bottom:1px solid #e4e8e2;vertical-align:top}th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;background:#edf0eb;color:#42544e}td{font-size:13px}code{font-size:12px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:430px;overflow:auto;background:#edf0eb;padding:12px}summary{cursor:pointer;color:var(--green)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.filters input{flex:1;min-width:200px}.badge{font-size:12px;padding:3px 7px;background:#edf0eb;white-space:nowrap}.failed{background:#f7ddce;color:#77391a}.good{background:#e0ede3;color:#21533c}.link{background:none;border:0;padding:0;text-decoration:underline;color:var(--green);text-align:left}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}a{color:#245c4b}.empty{padding:28px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:20px 4vw;font-size:12px;color:var(--muted)}@media(max-width:600px){header{align-items:flex-start;gap:10px}header p{font-size:12px}.metric strong{font-size:23px}main{padding:20px 15px}nav{padding:12px 15px}td,th{padding:8px}}
</style></head><body><header><div><h1>AZIMUTH</h1><p>Operations / Solana</p></div><div><span class="badge good">READ ONLY</span><p id="stamp">Loading local evidence…</p></div></header>
<nav aria-label="Dashboard sections"><button data-tab="overview" aria-current="true">Overview</button><button data-tab="journal">Journal</button><button data-tab="evaluation">Evaluations</button><button data-tab="hermes">Hermes</button><button data-tab="redis">Redis</button></nav>
<main id="content" aria-live="polite"></main><footer>Local observations, refreshed every 30 seconds. No wallet RPC, inference, Helius calls or trading actions. <a href="/api/overview">JSON API</a></footer>
<script>
const $=s=>document.querySelector(s), esc=x=>String(x??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>x===null||x===undefined||!Number.isFinite(Number(x))?'Unknown':Number(x).toLocaleString(undefined,{maximumFractionDigits:6});
const txlink=x=>/^[1-9A-HJ-NP-Za-km-z]{64,90}$/.test(x)?`<a href="https://solscan.io/tx/${esc(x)}" target="_blank" rel="noopener noreferrer">Solscan transaction</a>`:'';
const date=x=>x?new Date(Number(x)*1000).toLocaleString():'Unknown';
const age=x=>x?Math.max(0,Math.round((Date.now()/1000-x)/60))+' min ago':'Unknown';
const metric=(label,value,note='')=>`<div class="metric"><span class="muted">${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(note)}</small></div>`;
const detail=(label,value)=>`<details><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(value,null,2))}</pre></details>`;
const table=(heads,rows)=>`<div class="table"><table><thead><tr>${heads.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">No observed records in this source.</td></tr>`}</tbody></table></div>`;
let tab='overview',offset=0,query='',stage='',request=0;
async function api(path){const r=await fetch('/api/'+path);if(!r.ok)throw Error(await r.text());return r.json()}
async function render(){const req=++request;try{let html='';
if(tab==='overview') {const [o,e]=await Promise.all([api('overview'),api('evaluation')]);const n=o.nav||{},r=e.report||{},cash=r.root_cash_cohort||{};
$('#stamp').textContent='Observed '+date(o.collected_at);
html='<h2>Capital & operations</h2><p class="muted">Wallet components and service state, each with its own evidence time.</p>';
if(o.collection_error)html+=`<p class="note warn">${esc(o.collection_error)}</p>`;
html+=`<div class="grid">${metric('Native SOL',num(n.native_sol),'Snapshot '+age(n.ts))}${metric('SPL mark · SOL',num(n.spl_mark_sol),'Partial valuation; see missing marks')}${metric('LP capital mark · SOL',num(n.lp_mark_sol),'Position valuation, not executable cash')}${metric('Refundable rent · SOL',num(n.refundable_rent_sol),'Recoverable reserve, not profit')}${metric('Complete NAV · SOL',num(n.nav_sol),n.nav_sol==null?'Incomplete valuation':'Observed portfolio value')}${metric('Root cash before shared refunds · SOL',num(cash.settled_cash_sol),'Shared refunds: see Evaluations · '+age(r.generated_at))}</div>`;
html+=`<p class="note ${n.native_sol!=null&&n.native_sol<.35?'warn':''}">${n.native_sol==null?'Entry capacity unknown: native balance unavailable.':n.native_sol<.35?'Below 0.35 SOL: no new position under the existing reserve rule.':'Native balance meets the 0.35 SOL floor; other entry gates still apply.'} Reserve 0.20 + rent/fee allowance 0.05 + minimum position 0.10 SOL. Native balance growth can include principal and rent recovery.</p>`;
html+=`<p>Snapshot ${esc(date(n.ts))} · ${esc(age(n.ts))} · Known subtotal ${num(n.known_asset_subtotal_sol)} SOL. ${(n.issues||[]).length} valuation issues; expand asset evidence for details.</p>`;
html+='<h3>Services</h3><p class="muted">Inactive oneshot services may be healthy between timer runs. Failed status describes the last run, not necessarily a network outage.</p>'+table(['Unit','State','Result','Last active'],(o.services||[]).map(s=>[esc(s.Id),`<span class="badge ${s.ActiveState==='failed'?'failed':s.ActiveState==='active'?'good':''}">${esc(s.ActiveState)} / ${esc(s.SubState)}</span>`,esc(s.Result||s.LoadState),esc(s.ActiveEnterTimestamp)]));
html+='<h3>Asset evidence</h3>'+detail('Token and LP marks',n)+'<h3>Source freshness</h3>'+table(['Local source','Modified','Coverage'],(o.sources||[]).map(s=>[`<code>${esc(s.path)}</code>`,esc(date(s.modified_at)),esc(s.status)+' · '+s.rows+' retained rows'+(s.truncated?' · bounded tail':'')+(s.invalid_lines?' · '+s.invalid_lines+' invalid lines':'')]));
}
if(tab==='journal'){const d=await api('journal?offset='+offset+'&q='+encodeURIComponent(query)+'&stage='+encodeURIComponent(stage));html='<h2>Decision & execution journal</h2><p class="muted">Candidate → AI / fallback → gate → deploy → exit → swap → refund</p><p class="note">Webhook acceptance, probe success and a session row do not prove a trade. Match explicit identifiers; pool or time similarity alone is insufficient.</p>';
html+=`<form class="filters" id="filters"><input aria-label="Filter journal by identifier or text" name="q" placeholder="Pool, position, signature, delivery or root ID" value="${esc(query)}"><select name="stage" aria-label="Stage"><option value="">All stages</option>${['candidate','AI / fallback','gate','deploy','exit','swap','refund','settlement','transaction'].map(s=>`<option ${s===stage?'selected':''}>${esc(s)}</option>`).join('')}</select><button>Filter</button></form>`;
html+=table(['Observed','Stage','Explicit identifiers','Evidence'],d.rows.map(e=>{const v=e.evidence||{},ids=['delivery_id','entry_id','root_chain_id','position','session_id','signature','refund_signature'].filter(k=>v[k]);return [esc(date(e.time)),`<span class="badge">${esc(e.stage)}</span>`,ids.map(k=>`<div>${esc(k)}<br><button class="link" data-search="${esc(v[k])}"><code>${esc(v[k])}</code></button></div>`).join('')||'Uncorrelated',detail(v.reason||v.stage||v.kind||'View evidence',e)+txlink(v.signature||v.refund_signature||'')]}));html+=`<div class="bar"><button id="prev" ${offset===0?'disabled':''}>Previous</button><span>${d.total_in_retained_tail?offset+1:0}–${Math.min(offset+50,d.total_in_retained_tail)} of ${d.total_in_retained_tail} retained matches</span><button id="next" ${offset+50>=d.total_in_retained_tail?'disabled':''}>Next</button></div><p class="muted">${esc(d.scope)}</p>`;
}
if(tab==='evaluation'){const d=await api('evaluation'),e=d.report||{},c=e.root_cash_cohort||{},lp=e.lp_comparison||{},native=e.native_cash_change||{};html='<h2>Evaluation</h2><p class="muted">'+esc(date(e.start))+' — '+esc(date(e.end))+' · generated '+esc(date(e.generated_at))+'</p>';
html+=`<div class="grid">${metric('LP valuation PnL · SOL',num(lp.azimuth?.lp_pnl_sol),'Full-life positions in the report window')}${metric('Root cash before shared refunds · SOL',num(c.settled_cash_sol),`${c.settled_roots??'?'} settled / ${c.window_roots??'?'} window roots`)}${metric('Native balance change · SOL',num(native.change_sol),'Principal, swaps, fees, rent and transfers included')}${metric('Wealth change · SOL',num(e.wealth_change?.flow_adjusted_change_sol),'Requires complete NAV and external-flow accounting')}</div>`;
html+='<h3>Comparable LP cohorts</h3>'+table(['Cohort','Status','LP PnL · SOL','Wins / full-life positions','Carry-in closes','Basis'],Object.entries(lp).map(([k,v])=>[esc(k),esc(v.status),num(v.lp_pnl_sol),`${num(v.wins)} / ${num(v.full_life_positions)}${v.full_life_positions&&v.wins!=null?' ('+num(100*v.wins/v.full_life_positions)+'%)':''}`,num(v.carry_in_closes)+(v.zero_deposit_closes!=null?'<br>Zero deposit: '+num(v.zero_deposit_closes):''),esc((v.basis||'Unknown').replaceAll('_',' '))+(v.win_basis?'<br>'+esc(v.win_basis.replaceAll('_',' ')):'')+(v.breakeven_positions!=null?'<br>Break-even: '+num(v.breakeven_positions):'')]));
html+=`<p class="note">Cash-positive settled roots: ${num(c.cash_positive_roots)} / ${num(c.settled_roots)}. Incomplete roots: ${num(c.incomplete_roots)}. This cash ratio is not a trading win rate. Pooled settlements and matched refund groups overlap root cash and must never be added together.</p>`;
html+='<h3>Root settlement evidence</h3>'+table(['Root','Status','LP PnL · SOL','Cash · SOL','Unmatched evidence'],(c.roots||[]).map(r=>[`<code>${esc(r.root)}</code>`,esc(r.status),num(r.lp_pnl_sol),num(r.cash_sol),esc((r.reasons||[]).join(', '))]));
html+='<h3>Cash with matched rent refunds</h3><p class="muted">Each group includes its linked roots and refunds once. Groups overlap the root cash table above.</p>'+table(['Roots','Cash including matched refunds · SOL','Network fees · SOL'],(e.rent_refund_groups||[]).map(g=>[g.root_chain_ids.map(r=>`<code>${esc(r)}</code>`).join('<br>'),num(g.cash_with_matched_refunds_sol),num(g.network_fee_sol)]));
html+=detail('Pooled settlements · no per-root allocation',e.accounting?.pooled_settlements)+detail('Matched refunds · shared fees counted once',e.rent_refund_groups)+detail('Native balance timestamps and basis',native)+detail('Flow-adjusted wealth evidence',e.wealth_change)+detail('Meridian and Azimuth cohort details',lp)+detail('Evaluation limits',e.limits)+detail('Persisted evaluation JSON',e)+`<p class="muted">Source: <code>${esc(d.source)}</code></p>`;
}
if(tab==='hermes'){const h=await api('hermes');html='<h2>Hermes runtime</h2><p class="muted">Allowlisted configuration and recent session metadata. Secrets, prompts and message contents are excluded.</p>';
html+=`<div class="grid">${metric('Profile',h.profile,h.config_status)}${metric('Configured model',h.model?.default||h.model||'Unknown',h.model?.provider||'')}${metric('Gateway',h.gateway?.ActiveState||'Unknown',h.gateway?.SubState||'')}${metric('Provider availability','Unknown','Configuration is not a live probe')}${metric('Bot delivery','Unknown',h.bot?.configured?'Configuration present':'Configuration unavailable')}</div>`;
html+=`<p class="note">${esc(h.session_note)} ${esc(h.webhook_state)}</p>`+detail('Model and fallback configuration', {model:h.model,fallbacks:h.fallback_providers})+detail('Installed profile skills',h.skills);
html+='<h3>Recent sessions</h3>'+table(['Session','Source / model','Started','Ended','Tool calls'],(h.sessions||[]).map(s=>[`<code>${esc(s.id)}</code>`,esc(s.source)+' / '+esc(s.model),esc(date(s.started_at)),s.ended_at?esc(date(s.ended_at)):'No end recorded · liveness unknown',num(s.tool_call_count)]));
}
if(tab==='redis'){const d=await api('redis');html='<h2>Redis observations</h2><p class="muted">Targeted reads · '+esc(d.status)+' · '+esc(date(d.observed_at))+'</p>';
html+=`<div class="grid">${metric('Active positions',num(d.active_position_count),'Redis tracking, not on-chain proof')}${metric('Sampled positions',num(d.position_sample_count),'Up to 100 members')}</div><p class="note">${esc(d.scope||'Redis observations unavailable.')} TTL is measured at collection time.</p>`;
html+=table(['Key','TTL · seconds','Allowlisted position metadata'],(d.rows||[]).map(r=>[`<code>${esc(r.key)}</code>`,num(r.ttl_seconds),r.value?detail('Position',r.value):'—']));
}
if(req!==request)return;$('#content').innerHTML=html;
if(tab==='journal'){$('#filters').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);query=f.get('q');stage=f.get('stage');offset=0;render()};$('#prev').onclick=()=>{offset=Math.max(0,offset-50);render()};$('#next').onclick=()=>{offset+=50;render()};document.querySelectorAll('[data-search]').forEach(b=>b.onclick=()=>{query=b.dataset.search;stage='';offset=0;render()})}
}catch(e){if(req===request)$('#content').innerHTML='<p role="alert" class="note warn">'+esc(e.message)+'</p>'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-current',x===b));render()});render();setInterval(()=>{if(tab==='overview'||tab==='redis')render()},30000);
</script></body></html>
