name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$unformatted" ]; then
            echo "Needs gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build -o azimuth .
          go build -o azimuth-dashboard ./cmd/dashboard

      - name: Smoke test (-version)
        run: ./azimuth -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Solana execution and accounting regression checks
        run: |
          node assets/skill/scripts/test_dlmm_executor.js
          node assets/skill/scripts/test_dlmm_entry_forecast.js
          python3 assets/skill/scripts/test_dlmm_entry_forecast_evaluation.py
          node assets/skill/scripts/test_dlmm_position_lookup.js
          node assets/skill/scripts/test_dlmm_rpc_accounts.js
          node assets/skill/scripts/test_dlmm_route_retry.js
          node assets/skill/scripts/test_dlmm_position_pda.js
          node assets/skill/scripts/test_dlmm_close_broadcast.js
          node assets/skill/scripts/test_dlmm_risk_mark.js
          node assets/skill/scripts/test_dlmm_canonical_liquidity.js
          python3 assets/skill/scripts/test_dlmm_canonical_liquidity.py
          python3 assets/skill/scripts/test_dlmm_guards.py
          python3 assets/skill/scripts/test_dlmm_monitor_bounds.py
          python3 assets/skill/scripts/test_dlmm_hold_canary.py
          python3 assets/skill/scripts/test_dlmm_exit_liquidity.py
          python3 assets/skill/scripts/test_dlmm_yield_availability.py
          python3 assets/skill/scripts/test_dlmm_alerts.py
          python3 assets/skill/scripts/test_dlmm_risk_integration.py
          python3 assets/hermes/scripts/test_sol_dlmm_exit_review_gate.py
          python3 assets/skill/scripts/test_dlmm_entry_liquidity.py
          python3 assets/skill/scripts/test_dlmm_ladder_coverage.py
          python3 assets/skill/scripts/test_dlmm_pool_cash_gate.py
          python3 assets/skill/scripts/test_dlmm_recent_pool_losses.py
          python3 assets/skill/scripts/test_solana_policy.py
          python3 assets/skill/scripts/test_dlmm_accounting.py
          python3 assets/skill/scripts/test_dlmm_recovered_close.py
          python3 assets/skill/scripts/test_dlmm_reconcile.py
          python3 assets/skill/scripts/test_dlmm_profit_acceptance.py
          python3 assets/skill/scripts/test_dlmm_cash_sign.py
          node assets/skill/scripts/test_dlmm_cash_sign.js
          node assets/skill/scripts/test_dlmm_nav.js
          node assets/skill/scripts/test_dlmm_retained_rent.js
          node assets/skill/scripts/test_dlmm_exit_bank.js
          python3 assets/skill/scripts/test_dlmm_shadow.py
          python3 assets/skill/scripts/test_dlmm_candidate_paper.py
          python3 assets/skill/scripts/test_dlmm_candidate_portfolio.py
          python3 assets/skill/scripts/test_dlmm_candidate_replay.py
          python3 assets/skill/scripts/test_dlmm_net_execution_stress.py
          python3 assets/skill/scripts/test_dlmm_net_experiment.py
          python3 assets/skill/scripts/test_dlmm_net_search.py
          node assets/skill/scripts/test_dlmm_price_path.js
          python3 assets/skill/scripts/test_dlmm_price_path_features.py
          python3 assets/skill/scripts/test_dlmm_fee_forecast.py
          python3 assets/skill/scripts/test_dlmm_candidate_watch.py
          python3 assets/skill/scripts/test_dlmm_observe_bounds.py
          python3 assets/skill/scripts/test_dlmm_observe_round2.py
          python3 assets/skill/scripts/test_dlmm_observer_deploy.py
          python3 assets/skill/scripts/test_dlmm_observer_idle.py
          python3 assets/skill/scripts/test_dlmm_width_study.py
          python3 assets/skill/scripts/test_dlmm_ai_health.py
