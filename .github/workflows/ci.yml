name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$unformatted" ]; then
            echo "Needs gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: go build -o azimuth .

      - name: Smoke test (-version)
        run: ./azimuth -version
